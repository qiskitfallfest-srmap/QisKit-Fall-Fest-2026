<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QFF 2026 Invitations</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style id="page-size">@page { size: A4 portrait; margin: 0; }</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Site theme tokens from app/globals.css */
    --ink: #16171B; --burgundy: #6C151E; --gold: #B08D57; --muted: #5a5b60; --paper: #FBF9F6;
    --ui-bg: #f8fafc; --ui-panel: #ffffff; --ui-border: #e2e8f0; --ui-text: #0f172a; --ui-sub: #64748b; --ui-accent: #6C151E;
  }
  body { background: var(--ui-bg); color: var(--ui-text); font-family: Inter, system-ui, sans-serif; font-size: 14px; }

  /* ---------- Editor (screen only) ---------- */
  .app { display: grid; grid-template-columns: 460px 1fr; min-height: 100vh; }
  .panel { background: var(--ui-panel); border-right: 1px solid var(--ui-border); padding: 20px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
  .panel h1 { font-size: 17px; font-weight: 600; }
  .panel .hint { color: var(--ui-sub); font-size: 12.5px; margin-top: 4px; line-height: 1.45; }
  .panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ui-sub); margin: 22px 0 10px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--ui-border); background: #fff; color: var(--ui-text); cursor: pointer; }
  button:hover { background: #f1f5f9; }
  button.primary { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }
  button.primary:hover { background: #3A0B10; }
  button.danger { color: #b91c1c; }
  .status { font-size: 12px; color: var(--ui-sub); }
  .invitee-row { border: 1px solid var(--ui-border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .invitee-row.off { opacity: .55; }
  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .row-head label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ui-sub); }
  .row-head .num { font-weight: 600; color: var(--ui-text); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field.full { grid-column: 1 / -1; }
  .field span { font-size: 11.5px; color: var(--ui-sub); }
  input[type=text], select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--ui-border); border-radius: 6px; background: #fff; color: var(--ui-text); width: 100%; }
  input[type=text]:focus, select:focus { outline: 2px solid #cbd5e1; border-color: #94a3b8; }
  .preview { padding: 28px; display: flex; flex-wrap: wrap; gap: 24px; align-content: flex-start; justify-content: center; }
  .preview .sheet { box-shadow: 0 1px 3px rgba(15,23,42,.12), 0 1px 2px rgba(15,23,42,.06); }

  /* ---------- Invitation card (A5) ---------- */
  .sheet { background: var(--paper); }
  .card { width: 148mm; height: 210mm; padding: 7mm; background: var(--paper); color: var(--ink); font-family: 'EB Garamond', Georgia, serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .frame { height: 100%; border: 0.6mm solid var(--burgundy); outline: 0.25mm solid var(--gold); outline-offset: -1.6mm;
    padding: 9mm 10mm 6mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logos { display: flex; align-items: center; justify-content: center; gap: 5mm; }
  .logos .srm { height: 13mm; }
  .logos .badge { height: 15mm; }
  .foot { margin-top: 4mm; display: flex; align-items: center; gap: 2.5mm; font-size: 7.5pt; color: var(--muted); }
  .foot .ibm { height: 3.4mm; }
  .logo-divider { width: 0.25mm; height: 11mm; background: var(--gold); }
  .tier { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 8.5pt; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-top: 3mm; }
  .ornament { display: flex; align-items: center; gap: 2.5mm; margin: 2.5mm 0 4mm; }
  .ornament span { width: 18mm; height: 0.25mm; background: var(--gold); }
  .ornament i { width: 1.8mm; height: 1.8mm; background: var(--gold); transform: rotate(45deg); }
  .lead { font-style: italic; font-size: 11pt; color: var(--muted); line-height: 1.5; }
  .event { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 14.5pt; letter-spacing: .08em; text-transform: uppercase; color: var(--burgundy); margin: .5mm 0 1mm; }
  .invitee { margin: 5mm 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .name { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 19pt; line-height: 1.2; }
  .designation { font-size: 11.5pt; margin-top: 1.2mm; }
  .role { font-style: italic; font-size: 11pt; margin-top: 1.2mm; color: var(--burgundy); }
  .rule { border-bottom: 0.25mm solid var(--muted); }
  .rule-name { width: 88mm; height: 11mm; }
  .rule-desig { width: 72mm; height: 8mm; margin-top: 1mm; }
  .occasion { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 18pt; color: var(--burgundy); margin-top: .5mm; }
  .sub { font-size: 10pt; color: var(--muted); }
  .details { margin-top: 5.5mm; padding: 3.5mm 0; border-top: 0.25mm solid var(--gold); border-bottom: 0.25mm solid var(--gold); width: 96mm; display: grid; gap: 1.6mm; }
  .details div { display: grid; grid-template-columns: 17mm 1fr; text-align: left; font-size: 10.5pt; line-height: 1.3; }
  .k { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding-top: .6mm; }
  .closing { margin-top: auto; line-height: 1.45; }
  .closing .regards { font-style: italic; font-size: 10.5pt; color: var(--muted); }
  .closing .team { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 11pt; color: var(--burgundy); margin-top: 1mm; }
  .closing .org { font-size: 10.5pt; }
  .rsvp { margin-top: 3mm; font-size: 9pt; color: var(--muted); letter-spacing: .04em; }

  /* Print layouts. Both use A4 paper.
     full: one invitation per A4 page, the A5 design scaled up by sqrt(2) so it keeps its proportions.
     twoUp: two A5 invitations side by side on A4 landscape, cut down the middle. */
  .sheet { display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  body.full .sheet { width: 210mm; height: 297mm; }
  body.full .sheet .card { zoom: 1.41421; }
  /* Off-screen stage used to render one unscaled card at a time for image export. */
  #export-stage { position: fixed; left: -10000px; top: 0; }
  body.twoUp .sheet { width: 297mm; height: 210mm; background: #fff; }
  body.twoUp .sheet .card { flex: 0 0 148.5mm; width: 148.5mm; }
  body.twoUp .sheet::after { content: ""; position: absolute; top: 0; bottom: 0; left: 148.5mm; border-left: 0.15mm dashed #b8b8b8; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .panel { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--ui-border); }
    .preview { padding: 16px; overflow-x: auto; justify-content: flex-start; }
  }
  /* Must come after the narrow-screen rules: a printed page is narrower than 900px. */
  @media print {
    body { background: #fff; }
    .app { display: block; min-height: 0; }
    .panel { display: none; }
    .preview { padding: 0; display: block; }
    /* Clip each sheet to exactly one page so sub-pixel overflow never spills onto a blank page. */
    .preview .sheet { box-shadow: none; break-before: page; page-break-before: always; }
    .preview .sheet:first-child { break-before: auto; page-break-before: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Qiskit Fall Fest 2026 &middot; Invitations</h1>
    <p class="hint">Type each invitee's name and designation. Changes save automatically in this browser. Leave the name empty to print a blank line for handwriting.</p>
    <div class="toolbar">
      <button class="primary" id="print">Print</button>
      <button id="download-images">Download images</button>
      <select id="paper" title="Paper">
        <option value="full">A4, one invitation per page</option>
        <option value="twoUp">A4, two per page (cut in half)</option>
      </select>
      <span class="status" id="status"></span>
    </div>

    <h2>Card text (applies to every card)</h2>
    <div class="grid2" id="card-text"></div>

    <h2>Invitees</h2>
    <div id="list"></div>
    <div class="toolbar">
      <button id="add">Add invitee</button>
      <button id="export">Export list</button>
      <button id="import">Import list</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>

    <h2>RSVP (optional)</h2>
    <div class="grid2" id="settings"></div>
    <div class="toolbar"><button class="danger" id="reset">Reset to default list</button></div>
  </aside>

  <main class="preview" id="preview"></main>
</div>

  const STORAGE_KEY = 'qff2026-invitations-v1';

  // Source: data/offlineSchedule.ts (Day 01 inauguration, Day 05 valedictory).
  const OCCASIONS = {
    inaugural:   { label: 'Inaugural Ceremony',   date: 'Monday, 26 October 2026', time: '10:00 AM', venue: 'Auditorium, X-Lab' },
    valedictory: { label: 'Valedictory Ceremony', date: 'Friday, 30 October 2026', time: '11:00 AM', venue: 'Auditorium, X-Lab' },
  };
  const CAMPUS = 'SRM University-AP, Amaravati, Andhra Pradesh';

  const blankInvitee = (designation = '', occasion = 'inaugural') =>
    ({ include: true, name: '', designation, organisation: designation ? 'SRM University-AP' : '', role: '', occasion });

  const DEFAULT_STATE = {
    invitees: [
      blankInvitee('Vice Chancellor'),
      blankInvitee('Pro Vice Chancellor'),
      blankInvitee('Registrar'),
      blankInvitee('Dean, School of Engineering and Sciences'),
      blankInvitee('Dean, Quantum'),
    ],
    text: {
      tier: 'Partner Plus Host',
      organiser: 'The Organising Committee of',
      event: 'Qiskit Fall Fest 2026',
      invite: 'requests the honour of the presence of',
      grace: 'to grace the',
      subtitle: 'of the on-campus festival of quantum computing',
      regards: 'Regards,',
      team: 'Organizing Team',
      teamOrg: 'Qiskit Fall Fest SRMAP',
      footer: 'Partner Plus Host · SRM University-AP',
    },
    settings: { rsvpName: '', rsvpPhone: '' },
    paper: 'full',
  };

  let state = load();

  // Fill in any keys missing from an older saved or imported list.
  function merge(saved) {
    const base = structuredClone(DEFAULT_STATE);
    return { ...base, ...saved, settings: { ...base.settings, ...saved.settings }, text: { ...base.text, ...saved.text } };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        return merge(saved);
      }
    } catch (e) { /* fall through to defaults */ }
    return structuredClone(DEFAULT_STATE);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setStatus('Saved');
    } catch (e) {
      setStatus('Could not save in this browser. Use Export list to keep a copy.');
    }
  }

  let statusTimer;
  function setStatus(text) {
    const el = document.getElementById('status');
    el.textContent = text;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { el.textContent = ''; }, 1800);
  }

  const esc = (s) => String(s ?? '').trim()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---------- Editor ----------
  function renderList() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    state.invitees.forEach((inv, i) => {
      const row = document.createElement('div');
      row.className = 'invitee-row' + (inv.include ? '' : ' off');
      row.innerHTML = `
        <div class="row-head">
          <span class="num">${i + 1}</span>
          <label><input type="checkbox" data-k="include" ${inv.include ? 'checked' : ''}> Print</label>
          <button class="danger" data-act="remove">Remove</button>
        </div>
        <div class="grid2">
          <label class="field full"><span>Name with honorific</span>
            <input type="text" data-k="name" placeholder="e.g. Prof. (Dr.) First Last" value="${esc(inv.name)}"></label>
          <label class="field full"><span>Designation</span>
            <input type="text" data-k="designation" placeholder="e.g. Vice Chancellor" value="${esc(inv.designation)}"></label>
          <label class="field full"><span>Organisation</span>
            <input type="text" data-k="organisation" placeholder="e.g. SRM University-AP" value="${esc(inv.organisation)}"></label>
          <label class="field"><span>Role (optional)</span>
            <input type="text" data-k="role" placeholder="e.g. Chief Guest" value="${esc(inv.role)}"></label>
          <label class="field"><span>Occasion</span>
            <select data-k="occasion">${Object.entries(OCCASIONS).map(([k, o]) =>
              `<option value="${k}" ${inv.occasion === k ? 'selected' : ''}>${o.label}</option>`).join('')}</select></label>
        </div>`;
      row.addEventListener('input', (e) => {
        const k = e.target.dataset.k;
        if (!k) return;
        inv[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
        row.classList.toggle('off', !inv.include);
        save(); renderPreview();
      });
      row.querySelector('[data-act=remove]').addEventListener('click', () => {
        const label = inv.name || inv.designation || `invitee ${i + 1}`;
        if (!confirm(`Remove ${label}?`)) return;
        state.invitees.splice(i, 1);
        save(); renderList(); renderPreview();
      });
      list.appendChild(row);
    });
  }

  function renderCardText() {
    const fields = [
      ['tier', 'Line under the logos', true], ['event', 'Event name', true],
      ['organiser', 'Opening line', false], ['invite', 'Invitation line', false],
      ['grace', 'Line before the ceremony', false], ['subtitle', 'Line after the ceremony', false],
      ['regards', 'Closing', false], ['team', 'Closing: team', false],
      ['teamOrg', 'Closing: organisation', true],
      ['footer', 'Footer text', true],
    ];
    document.getElementById('card-text').innerHTML = fields.map(([k, label, full]) =>
      `<label class="field${full ? ' full' : ''}"><span>${label}</span><input type="text" data-k="${k}" value="${esc(state.text[k])}"></label>`).join('');
  }
  document.getElementById('card-text').addEventListener('input', (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    state.text[k] = e.target.value;
    save(); renderPreview();
  });

  function renderSettings() {
    const s = state.settings;
    const fields = [
      ['rsvpName', 'RSVP contact name'], ['rsvpPhone', 'RSVP phone'],
    ];
    const box = document.getElementById('settings');
    box.innerHTML = fields.map(([k, label]) =>
      `<label class="field"><span>${label}</span><input type="text" data-k="${k}" value="${esc(s[k])}"></label>`).join('');
  }
  document.getElementById('settings').addEventListener('input', (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    state.settings[k] = e.target.value;
    save(); renderPreview();
  });

  // ---------- Card ----------
  function cardHTML(inv) {
    const occ = OCCASIONS[inv.occasion] || OCCASIONS.inaugural;
    const s = state.settings;
    const name = esc(inv.name), desig = esc(inv.designation), org = esc(inv.organisation), role = esc(inv.role);

    const nameHTML = name ? `<div class="name">${name}</div>` : '<div class="rule rule-name"></div>';
    const desigHTML = desig ? `<div class="designation">${desig}${org ? ', ' + org : ''}</div>` : '<div class="rule rule-desig"></div>';
    const roleHTML = role ? `<div class="role">as the ${role}</div>` : '';

    const rsvp = [s.rsvpName, s.rsvpPhone].map(esc).filter(Boolean);
    const tx = state.text;
    // Empty card-text fields are left off the card.
    const line = (k, cls = k) => tx[k].trim() ? `<p class="${cls}">${esc(tx[k])}</p>` : '';

    return `
      <section class="card"><div class="frame">
        <div class="logos"><img class="srm" src="${SRM_LOGO}" alt="SRM University-AP"><span class="logo-divider"></span><img class="badge" src="${BADGE}" alt="Qiskit Fall Fest 2026"></div>
        ${line('tier')}
        <div class="ornament"><span></span><i></i><span></span></div>
        ${line('organiser', 'lead')}
        ${line('event')}
        ${line('invite', 'lead')}
        <div class="invitee">${nameHTML}${desigHTML}${roleHTML}</div>
        ${line('grace', 'lead')}
        <p class="occasion">${occ.label}</p>
        ${line('subtitle', 'sub')}
        <div class="details">
          <div><span class="k">Date</span><span class="v">${occ.date}</span></div>
          <div><span class="k">Time</span><span class="v">${occ.time}</span></div>
          <div><span class="k">Venue</span><span class="v">${occ.venue}<br>${CAMPUS}</span></div>
        </div>
        <div class="closing">${line('regards', 'regards')}${line('team', 'team')}${line('teamOrg', 'org')}</div>
        ${rsvp.length ? `<div class="rsvp">RSVP &nbsp;&middot;&nbsp; ${rsvp.join(' &nbsp;&middot;&nbsp; ')}</div>` : ''}
        <div class="foot">${tx.footer.trim() ? `<span>${esc(tx.footer)}</span>` : ''}<img class="ibm" src="${IBM_LOGO}" alt="IBM Quantum"></div>
        
      </div></section>`;
  }

  // Group cards onto A4 sheets: one each in full-page mode, two each in two-up mode.
  function sheets(cards) {
    const perSheet = state.paper === 'twoUp' ? 2 : 1;
    const out = [];
    for (let i = 0; i < cards.length; i += perSheet) out.push(`<div class="sheet">${cards.slice(i, i + perSheet).join('')}</div>`);
    return out;
  }

  function renderPreview() {
    const included = state.invitees.filter((i) => i.include);
    document.getElementById('preview').innerHTML = included.length
      ? sheets(included.map(cardHTML)).join('')
      : '<p class="hint" style="color:var(--ui-sub)">No invitees selected for printing.</p>';
  }

  function applyPaper() {
    if (!['full', 'twoUp'].includes(state.paper)) state.paper = 'full';  // older saves used A5 options
    document.body.classList.toggle('full', state.paper === 'full');
    document.body.classList.toggle('twoUp', state.paper === 'twoUp');
    document.getElementById('page-size').textContent = state.paper === 'twoUp'
      ? '@page { size: A4 landscape; margin: 0; }'
      : '@page { size: A4 portrait; margin: 0; }';
    document.getElementById('paper').value = state.paper;
  }

  // ---------- Actions ----------
  document.getElementById('add').addEventListener('click', () => {
    state.invitees.push(blankInvitee());
    save(); renderList(); renderPreview();
    document.querySelector('#list .invitee-row:last-child input[data-k=name]').focus();
  });
  document.getElementById('print').addEventListener('click', () => window.print());

  // ---------- Image export: one PNG per invitee, named after them ----------
  const IMAGE_PIXEL_RATIO = 3;  // 148 mm card -> ~1680 px wide, about 290 dpi at A5

  function fileBase(inv) {
    return (inv.name || inv.designation || 'Invitation').trim()
      .replace(/[\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').replace(/[. ]+$/, '') || 'Invitation';
  }

  // Same person invited to both ceremonies gets the ceremony added; any remaining clash gets a number.
  function fileNames(invitees) {
    const counts = {};
    invitees.forEach((inv) => { const b = fileBase(inv); counts[b] = (counts[b] || 0) + 1; });
    const used = new Set();
    return invitees.map((inv) => {
      let name = fileBase(inv);
      if (counts[name] > 1) name += ' - ' + (OCCASIONS[inv.occasion] || OCCASIONS.inaugural).label;
      let unique = name, n = 2;
      while (used.has(unique.toLowerCase())) unique = `${name} (${n++})`;
      used.add(unique.toLowerCase());
      return unique + '.png';
    });
  }

  async function renderCardPng(inv) {
    const stage = document.getElementById('export-stage');
    stage.innerHTML = cardHTML(inv);
    const card = stage.firstElementChild;
    await Promise.all([...card.querySelectorAll('img')].map((img) => img.decode().catch(() => {})));
    return htmlToImage.toBlob(card, { pixelRatio: IMAGE_PIXEL_RATIO, backgroundColor: '#FBF9F6' });
  }

  function saveBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  document.getElementById('download-images').addEventListener('click', async (e) => {
    const button = e.currentTarget;
    const included = state.invitees.filter((i) => i.include);
    if (!included.length) { alert('Tick Print on at least one invitee.'); return; }
    if (typeof htmlToImage === 'undefined') { alert('Image export needs an internet connection to load. Reconnect and reload the page.'); return; }
    button.disabled = true;
    try {
      await document.fonts.ready;
      const names = fileNames(included);
      if (included.length === 1) {
        button.textContent = 'Preparing image...';
        saveBlob(await renderCardPng(included[0]), names[0]);
      } else {
        const zip = new JSZip();
        for (let i = 0; i < included.length; i++) {
          button.textContent = `Preparing ${i + 1} of ${included.length}...`;
          zip.file(names[i], await renderCardPng(included[i]));
        }
        saveBlob(await zip.generateAsync({ type: 'blob' }), 'QFF2026 Invitations.zip');
      }
    } catch (err) {
      alert('Could not create the images: ' + err.message);
    } finally {
      document.getElementById('export-stage').innerHTML = '';
      button.disabled = false;
      button.textContent = 'Download images';
    }
  });
  document.getElementById('paper').addEventListener('change', (e) => { state.paper = e.target.value; save(); applyPaper(); renderPreview(); });
  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('Replace the current list and settings with the default list? Export first if you want to keep it.')) return;
    state = structuredClone(DEFAULT_STATE);
    save(); renderAll();
  });
  document.getElementById('export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qff2026-invitations.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('import').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.invitees)) throw new Error('missing invitees');
      state = merge(data);
      save(); renderAll();
    } catch (err) {
      alert('That file is not an exported invitation list.');
    }
    e.target.value = '';
  });

  function renderAll() { renderCardText(); renderList(); renderSettings(); applyPaper(); renderPreview(); }
  renderAll();
</script>
<div id="export-stage"></div>
</body>
</html>
